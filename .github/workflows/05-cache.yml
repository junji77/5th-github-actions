# .github/workflows/05-cache.yml

name: 05. cache 기본 사용
on:
  workflow_dispatch

jobs:
  with-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 캐시 복원 시도
      - name: 캐시 (workflow 파일 기반)
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cached-data
          key: ${{ runner.os }}-mydata-${{ hashFiles('.github/workflows/05-cache.yml') }}
          restore-keys: |
            ${{ runner.os }}-mydata-

      # 2. 폴더 없으면 생성
      - name: 디렉토리 준비
        run: mkdir -p ~/cached-data

      # 3. 캐시 결과 확인
      - name: 캐시 결과 확인
        run: |
          echo "cache-hit: ${{ steps.cache.outputs.cache-hit }}"
          ls -al ~/cached-data || echo "비어있음"

      # 4. 데이터 생성 (다음 실행에서 캐시됨)
      - name: 데이터 추가
        run: |
          echo "이번 실행 데이터: $(date)" > ~/cached-data/data.txt
          ls -al ~/cached-data
